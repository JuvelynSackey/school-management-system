# Render blueprint — API-ONLY. This deploys server/ as a standalone
# service; the client is deployed separately on Vercel (see client/vercel.json
# and the Vercel setup steps). If you instead want ONE combined service
# where this same server serves the built client directly (no separate
# Vercel deploy, no CORS wiring needed), see the git history for this file
# on the `main` branch — that version is still the simpler option for a
# single-URL deploy; this one is for the split Render+Vercel setup.
#
# Import this file on Render's "Create new project" screen. You'll still be
# prompted to fill in the `sync: false` values by hand — they're secrets or
# deployment-specific values that don't belong committed to the repo.
#
# KNOWN LIMITATION — read before relying on file uploads in production:
# server/uploads/ (school logos, student photos) is a local, EPHEMERAL disk
# on Render's free/starter plans. A redeploy or restart wipes it. The `disk`
# block below (commented out) is the fix, but it requires a paid instance
# type — Render doesn't support persistent disks on the free tier. Until
# either that's added or uploads move to something like S3/Cloudinary,
# treat uploaded logos/photos as not-guaranteed-to-survive-a-redeploy.
services:
  - type: web
    name: jesmanage-api
    runtime: node
    plan: free
    buildCommand: npm install --workspace=server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Your MongoDB Atlas connection string (Atlas is already a replica
      # set, which the app needs for its multi-document transactions —
      # nothing extra required there). Paste it in on Render's dashboard.
      - key: MONGODB_URI
        sync: false
      # Render generates a random value for this on first deploy — you
      # never have to invent or paste one in.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # The deployed Vercel URL for the client (e.g.
      # https://jesmanage.vercel.app) — this is a genuine cross-origin
      # setup, unlike the combined single-service option, so this value is
      # actually load-bearing for CORS. Fill it in once the Vercel side is
      # deployed and you have its real URL; redeploy this service after.
      - key: CLIENT_ORIGIN
        sync: false
      # Optional — leave blank to keep the AI Remark Assistant / Announcement
      # Composer / Performance Summary / Anomaly Detection / Early-Warning /
      # Ask JesManage gated off (deterministic fallback templates instead),
      # exactly like in local dev with no key set. Get a key from
      # aistudio.google.com/app/apikey — must start with "AIzaSy" (legacy
      # Standard key) or "AQ." (the newer Auth key AI Studio now issues by
      # default; AIzaSy keys are being phased out through September 2026).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Optional — leave blank to keep email notifications silently
      # skipped, same as local dev.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    # Uncomment once on a paid plan, to stop uploads/ from being wiped on
    # every redeploy — see the KNOWN LIMITATION note above.
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/server/uploads
    #   sizeGB: 1
